<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhanced Forecast Chart</title>
  <link rel="icon" href="https://flaire.fi/wp-content/uploads/2024/01/cropped-flaire-favicon-32x32.png" sizes="32x32" />
  <link rel="icon" href="https://flaire.fi/wp-content/uploads/2024/01/cropped-flaire-favicon-192x192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="https://flaire.fi/wp-content/uploads/2024/01/cropped-flaire-favicon-180x180.png" />
  <meta name="msapplication-TileImage" content="https://flaire.fi/wp-content/uploads/2024/01/cropped-flaire-favicon-270x270.png" />
  <script defer
          src="https://cdn.plot.ly/plotly-basic-4.3.0.min.js"
          charset="utf-8">
  </script>
  <style>
    /* Fluid typography for headings */
    :root {
      --heading-fluid: clamp(22px, 4.5vw, 36px);
    }

    /* Default light theme styles */
    body {
      background-color: #f4f4f9;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      min-height: 100vh;
      padding: 20px 5px 10px 5px;
      box-sizing: border-box;
      transition: background-color 0.2s, color 0.2s;
      position: relative;
    }

    /* Header container for title */
    .header-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      position: relative;
    }

    /* Logo styling and positioning */
    .logo {
      position: absolute;
      left: 20px;
      top: 20px;
      height: clamp(35px, 5vw, 50px);
      width: auto;
      transition: filter 0.2s;
    }

    /* Invert logo colors for light theme */
    body.light-theme .logo {
      filter: invert(1);
    }

    body.dark-theme .logo {
      filter: none;
    }

    h1 {
      color: #000;
      font-weight: 350;
      margin: 0;
      font-size: var(--heading-fluid);
    }

    h2 {
      font-weight: 350;
      margin: 0;
      font-size: max(var(--heading-fluid) - 10px, 16px);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .controls-time {
      display: flex;
      gap: 15px;
      font-size: 16px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .control-field {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .controls-action {
      display: flex;
      gap: 15px;
      justify-content: center;
      align-items: center;
    }

    .controls label,
    .controls input,
    .controls button {
      font-size: 16px;
    }

    .controls button {
      padding: 8px 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
      background-color: #fff;
      color: #333;
      cursor: pointer;
    }

    .series-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .series-button {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid #ccc;
      background-color: #fff;
      cursor: pointer;
      font-size: 14px;

      /* Text formatting Logic */
      max-width: 240px;
      white-space: wrap;
      vertical-align: middle;
    }

    .series-button.active {
      background-color: #4a90e2;
      color: #fff;
      border-color: #4a90e2;
    }

    body.dark-theme .series-button {
      background-color: #222;
      color: #eee;
      border-color: #555;
    }

    body.dark-theme .series-button.active {
      background-color: #4a90e2;
      color: #fff;
      border-color: #4a90e2;
    }

    #forecast-date,
    #history-select {
      font-size: 16px;
    }

    #chart-title {
      margin: 0 0 15px 0;
      font-weight: 350;
      text-align: center;
    }

    #chart-container {
      --spot-extra-height: 0px;

      width: 100%;
      max-width: 1000px;
      height: calc(clamp(300px, 55vh, 700px) + var(--spot-extra-height));
      position: relative;
      margin: 0 0 0 0;
    }

    #chart-container.has-spotprices {
      --spot-extra-height: clamp(0px, calc((700px - 100vw) * 0.25), 100px);
    }

    /* Best time-window summaries below the chart */
    #best-windows-summary {
      width: 100%;
      max-width: 1000px;
      box-sizing: border-box;
      display: flex;
      flex-flow: row wrap;
      justify-content: center;
      align-items: stretch;
      gap: 10px;
      margin: 10px 0 4px;
    }

    #best-windows-summary:empty {
      display: none;
    }

    .best-window-card {
      flex: 0 1 auto;
      width: max-content;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
      padding: 9px 12px;
      border: 1.5px solid var(--best-window-color);
      border-radius: 8px;
      background-color: var(--best-window-fill);
      color: inherit;
    }

    .best-window-card-title {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.25;
    }

    .best-window-card-range,
    .best-window-card-average {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    /* General chart loading overlay */
    #chart-loading {
        position: absolute;
        inset: 0;
        z-index: 90;

        display: flex;
        flex-direction: row-reverse;
        align-items: center;
        justify-content: center;
        gap: 12px;

        background: rgba(244, 244, 249, 0.88);
        color: #333;

        font-size: 16px;
        font-weight: 600;
    }

    #chart-loading.is-hidden {
        display: none;
    }

    /* Make the bar-chart hover spike transparent */
    #chart.bar-hover .spikeline {
        opacity: 0.20 !important;
    }

    /* Loading spinner */
    .chart-loading-spinner {
        width: 22px;
        height: 22px;
        border: 4px solid rgba(74, 144, 226, 0.2);
        border-top-color: #4a90e2;
        border-radius: 50%;
        animation: chart-loading-spin 0.8s linear infinite;
    }

    #forecast-generated-at {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-top: 8px;
    }

    @keyframes chart-loading-spin {
        to {
            transform: rotate(360deg);
        }
    }

    @media (prefers-reduced-motion: reduce) {
    #chart-loading::before {
        animation: none;
      }
    }

    /* Dark theme */
    body.dark-theme #chart-loading {
        background: rgba(17, 17, 17, 0.88);
        color: #eee;
    }

    #spotprice-loading {
        display: none;
        position: absolute;
        inset: 0;
        flex-direction: row-reverse;
        align-items: center;
        justify-content: center;
        gap: 12px;

        background: rgba(244, 244, 249, 0.7);
        color: #333;

        z-index: 100;
        pointer-events: auto;
        cursor: wait;
        font-size: 16px;
        font-weight: 600;
    }

    body.dark-theme #spotprice-loading {
        background: rgba(17, 17, 17, 0.7);
        color: #eee;
    }

    #spotprice-loading.visible {
        display: flex;
    }

    /* Spinner */
    #spotprice-loading::before {
        content: "";
        width: 22px;
        height: 22px;
        flex-shrink: 0;

        border: 4px solid rgba(74, 144, 226, 0.2);
        border-top-color: #4a90e2;
        border-radius: 50%;

        animation: spotprice-spin 0.8s linear infinite;
    }

    @keyframes spotprice-spin {
        to {
            transform: rotate(360deg);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        #spotprice-loading::before {
            animation: none;
        }
    }

    /* Chart slider switches */
    .chart-type-toggle {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      column-gap: 8px;
      row-gap: 2px;
      margin: 8px auto 0;
      font-size: 16px;
    }

    .toggle-pair .chart-type-toggle {
        display: inline-flex;
    }

    .chart-type-switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
      flex: 0 0 auto;
    }

    .chart-type-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .chart-type-slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background-color: #4a90e2;
      border-radius: 999px;
      transition: background-color 0.2s;
    }

    /* Inherit properties but transform into an on/off switch */
    .on-off-slider .chart-type-slider {
      background-color: #bdbdbd;
    }

    .on-off-slider input:checked + .chart-type-slider {
        background-color: #4a90e2;
    }

    .chart-type-slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background-color: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .chart-type-switch input:checked + .chart-type-slider::before {
      transform: translateX(22px);
    }

    .chart-type-switch input:focus-visible + .chart-type-slider {
      outline: 3px solid #4a90e2;
      outline-offset: 2px;
    }

    body.dark-theme .chart-type-toggle {
      color: #eee;
    }

    /* Dark theme styles */
    body.dark-theme {
      background-color: #111;
      color: #eee;
    }

    body.dark-theme h1 {
      color: #fff;
    }

    body.dark-theme .controls button {
      background-color: #333;
      color: white;
      border: 1px solid #555;
    }

    /* The desktop layout remains expanded; the drawer only appears on small screens. */
    .control-drawer {
      width: 90%;
    }

    .drawer-content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .drawer-inner {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .drawer-toggle {
      display: none;
      width: min(100%, 850px);
      margin: 0 auto;
      padding: 12px 14px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #fff;
      color: #333;
      font: inherit;
      font-size: 16px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
    }

    .drawer-toggle:focus-visible {
      outline: 3px solid #4a90e2;
      outline-offset: 2px;
    }

    .drawer-chevron {
      display: inline-block;
      font-size: 22px;
      line-height: 0;
      transition: transform 0.3s ease;
    }

    .control-drawer.is-open .drawer-chevron {
      transform: rotateX(180deg);
    }

    body.dark-theme .drawer-toggle {
      background-color: #333;
      color: #fff;
      border-color: #555;
    }

    @media (max-width: 700px) {
      .header-container {
        flex-direction: column;
      }

      .logo {
        position: static;
        margin-bottom: 8px;
      }

      .drawer-toggle {
        display: flex;
      }

      .drawer-content {
        display: grid;
        grid-template-rows: 0fr;
        padding-top: 0;
        overflow: hidden;
        visibility: hidden;
        transition:
          grid-template-rows 0.28s ease,
          padding-top 0.28s ease,
          visibility 0s linear 0.28s;
      }

      .drawer-inner {
        min-height: 0;
        overflow: hidden;
      }

      .control-drawer.is-open .drawer-content {
        grid-template-rows: 1fr;
        padding-top: 14px;
        visibility: visible;
        transition:
          grid-template-rows 0.28s ease,
          padding-top 0.28s ease,
          visibility 0s;
      }

      .control-drawer {
        margin-bottom: 10px;
      }

      .controls {
        width: 100%;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .controls-time {
        display: grid;
        grid-template-columns: max-content max-content;
        justify-content: center;
        column-gap: 16px;
        width: fit-content;
        max-width: 560px;
        box-sizing: border-box;
        margin: 0 auto;
        gap: 8px 12px;
      }

      .control-field {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-width: 0;
      }

      .control-field label {
        flex: 0 1 auto;
        min-width: 0;
        white-space: normal;
      }

      .controls-time input,
      .controls-time select {
        flex: 0 0 auto;
        width: auto;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }

      /* Keep the three action buttons in one row, allowing their labels to wrap. */
      .controls-action {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        width: min(100%, 520px);
        margin: 0 auto;
        gap: 8px;
      }

      .controls-action button {
        min-width: 0;
        padding: 8px 6px;
        line-height: 1.2;
      }

      .series-buttons {
        width: 100%;
        gap: 10px;
        margin-bottom: 0;
      }

      .series-button {
        max-width: 140px;
        padding: 4px 8px;
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      .controls-time {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: auto;
        max-width: 100%;
        gap: 8px;
      }

      .control-field {
        width: min(100%, 290px);
        justify-content: space-between;
      }

      .controls-action {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: stretch;
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
        gap: 8px;
      }

      .controls-action button {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        box-sizing: border-box;
        padding: 7px 5px;
        font-size: 14px;
        line-height: 1.2;
        text-align: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .drawer-content,
      .drawer-chevron {
        transition: none;
      }
    }

    /* Statistics opener remains part of the main page; dialog styles live in its module. */
    .statistics-action {
      display: flex;
      justify-content: center;
      width: 100%;
      margin: 14px auto 4px;
    }
    .statistics-action button {
      border: 1px solid #4a90e2;
      border-radius: 7px;
      padding: 9px 18px;
      background: #4a90e2;
      color: #fff;
      font: inherit;
      font-size: 15px;
      cursor: pointer;
      transition: background-color .2s, border-color .2s;
    }
    .statistics-action button:hover { background: #357fcf; border-color: #357fcf; }
    .statistics-action button:focus-visible { outline: 3px solid #4a90e2; outline-offset: 3px; }

  </style>
</head>
<body class="light-theme">
  <!-- Logo positioned absolutely -->
  <img src="https://flaire.fi/wp-content/uploads/2024/04/Flaire-logo-white.png" alt="Logo" class="logo" />

  <!-- Header container for title -->
  <div class="header-container">
    <h1>Flaire Information Platform Demo</h1>
  </div>

  <div class="control-drawer" id="control-drawer">
    <button
      type="button"
      class="drawer-toggle"
      id="controls-toggle"
      aria-expanded="false"
      aria-controls="drawer-content"
    >
      <span>Chart controls</span>
      <span class="drawer-chevron" aria-hidden="true">⌵</span>
    </button>

    <div class="drawer-content" id="drawer-content">
      <div class="drawer-inner">
        <div class="controls">
          <div class="controls-time">
            <div class="control-field">
              <label for="forecast-date">Forecast date:</label>
              <input type="date" id="forecast-date">
            </div>

            <div class="control-field">
              <label for="history-select">History:</label>
              <select id="history-select"></select>
            </div>
          </div>

          <div class="controls-action">
            <button id="load-button">Load Forecast</button>
            <button id="latest-button">Latest Forecast</button>
            <button id="theme-toggle">Toggle Theme</button>
          </div>
        </div>

        <div id="series-buttons" class="series-buttons"></div>
      </div>
    </div>
  </div>

  <div class="chart-title-container">
    <h2 id="chart-title"></h2>
  </div>

  <div id="chart-container">
    <div id="chart" style="width:100%;height:100%;"></div>

    <div id="chart-loading" role="status" aria-live="polite">
      <span class="chart-loading-spinner" aria-hidden="true"></span>
      <span id="chart-loading-message">Loading chart library…</span>
    </div>

    <div id="spotprice-loading" aria-live="polite">Loading spot price data</div>
  </div>

  <div id="best-windows-summary" aria-label="Best time windows"></div>

  <div class="chart-type-toggle">
    <span class="toggle-pair chart-type-toggle">
      <span>Overlay spot price</span>
      <label class="chart-type-switch on-off-slider" aria-label="Toggle spot price overlay">
        <input type="checkbox" id="spotprice-toggle" role="switch" aria-checked="false">
        <span class="chart-type-slider"></span>
      </label>
    </span>

    <span class="toggle-pair chart-type-toggle">
      <span>Autoscale Y-axis</span>
      <label class="chart-type-switch on-off-slider" aria-label="Toggle Y-axis autoscaling">
        <input type="checkbox" id="yAutoscaleToggle" role="switch" aria-checked="false">
        <span class="chart-type-slider"></span>
      </label>
    </span>
  </div>

  <div class="chart-type-toggle">
    <span>Line graph</span>
    <label class="chart-type-switch" aria-label="Toggle main data series between line and bar chart">
      <input type="checkbox" id="chart-type-toggle" role="switch" aria-checked="false">
      <span class="chart-type-slider"></span>
    </label>
    <span>Bar chart</span>
  </div>
  
  <div class="statistics-action">
    <button type="button" id="calculate-statistics-button">Show statistics</button>
  </div>

  <div id="forecast-generated-at"></div>

  <!-- Statistics dialog markup and styles are provided by statistics-dialog.js. -->

  <!-- <div class="chart-full-screen-button">
      <button onclick="toggleFullscreen()">Chart to fullscreen</button>
  </div> -->

  <script type="module">
  import { StatisticsDialog } from "./statistics-dialog.js";

  const chartDiv = document.getElementById('chart');
  const chartLoading = document.getElementById("chart-loading");
  const chartLoadingMessage = document.getElementById("chart-loading-message");
  const forecastDateInput = document.getElementById('forecast-date');
  const loadButton = document.getElementById('load-button');
  const latestButton = document.getElementById('latest-button');
  const themeToggleButton = document.getElementById('theme-toggle');
  const historySelect = document.getElementById('history-select');
  const seriesButtonsContainer = document.getElementById('series-buttons');
  const controlsDrawer = document.getElementById('control-drawer');
  const controlsToggle = document.getElementById('controls-toggle');
  const mobileControlsMedia = window.matchMedia("(max-width: 700px)");
  const bestWindowsSummary = document.getElementById("best-windows-summary");
  const spotPriceToggle = document.getElementById("spotprice-toggle");
  const yAutoscaleToggle = document.getElementById("yAutoscaleToggle");
  const chartTypeToggle = document.getElementById("chart-type-toggle");
  const calculateStatisticsButton = document.getElementById("calculate-statistics-button");
  const statisticsDialog = new StatisticsDialog({
    getTheme: () => currentTheme,
    getLangVer
  });
  const DEFAULT_TZ = "Europe/Helsinki";
  const DEFAULT_LANG = "EN";
  let currentChartType = "line"
  let yAutoscale = false;
  let currentYAxisBaseline = null;
  let currentYAxisRange = null;

  // Set chart to display data as lines by default
  chartTypeToggle.checked = false;
  
  // Set autoscale toggle off by default
  yAutoscaleToggle.checked = false;

  // Set spot price overlay off by default
  spotPriceToggle.checked = false;

  // API config (adjust base URL if needed)
  let API_BASE = ""; // if site served from same host as API
  if (location.hostname.endsWith("github.io")) {
    API_BASE = "https://flipapi.net"; // if site served at GitHub Pages
  }

  let currentSeriesKey = "consumption_emissions"; // default; will be updated from /info
  let currentForecastRequest = { mode: "latest", date: null };
  let currentForecastPayload = null;
  let currentSpotPricePayload = null;

  // Default to light theme
  let currentTheme = 'light';

  function getMainChartTheme() {
  const isDark = currentTheme === "dark";

  return {
    template: isDark ? "plotly_dark" : "plotly_white",

    surface: isDark ? "#1c2229" : "#ffffff",
    text: isDark ? "#edf2f7" : "#263238",
    muted: isDark ? "#aab5c0" : "#66727c",
    grid: isDark ? "#444b54" : "#e5e7eb",
    fit: isDark ? "#f2f2f2" : "#263238",
    hoverBg: isDark ? "#252b33" : "#ffffff",
    hoverBorder: isDark ? "#59636e" : "#d5d9de",
    hoverText: isDark ? "#edf2f7" : "#263238",

    history: "rgb(74, 144, 226)",
    forecast: "rgb(255, 140, 0)"
    };
  }

  function setChartLoading(loading, message) {
      if (!chartLoading || !chartLoadingMessage) {
          console.warn("Chart loading elements not found.");
          return;
      }

      if (message) {
          chartLoadingMessage.textContent = message;
      }

      chartLoading.classList.toggle("is-hidden", !loading);
  }

  function setControlsDrawerOpen(open) {
    controlsDrawer.classList.toggle("is-open", open);
    controlsToggle.setAttribute("aria-expanded", String(open));
  }

  function closeControlsDrawerAfterSelection() {
    if (mobileControlsMedia.matches && controlsDrawer.classList.contains("is-open")) {
      setControlsDrawerOpen(false);
      controlsToggle.focus({ preventScroll: true });
    }
  }

  function syncControlsDrawerWithViewport() {
    // The drawer is always expanded on desktop and collapsed by default on mobile.
    setControlsDrawerOpen(!mobileControlsMedia.matches);
  }

  controlsToggle.addEventListener("click", () => {
    const isOpen = controlsDrawer.classList.contains("is-open");
    setControlsDrawerOpen(!isOpen);
  });

  if (typeof mobileControlsMedia.addEventListener === "function") {
    mobileControlsMedia.addEventListener("change", syncControlsDrawerWithViewport);
  } else {
    // Compatibility with older Safari versions.
    mobileControlsMedia.addListener(syncControlsDrawerWithViewport);
  }

  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && mobileControlsMedia.matches &&
        controlsDrawer.classList.contains("is-open")) {
      setControlsDrawerOpen(false);
      controlsToggle.focus();
    }
  });

  syncControlsDrawerWithViewport();

  function formatDate(date) {
    return date.toISOString().split('T')[0];
  }

  function formatPrettyDate(dateInput) {
    if (!dateInput) return "";
    
    // Use only the date part (YYYY-MM-DD) to avoid timezone shifting
    const datePart = typeof dateInput === 'string' ? dateInput.split('T')[0] : dateInput;
    
    return new Date(datePart).toLocaleDateString('en-US', {
      month: 'short',
      day: 'numeric',
      year: 'numeric',
      timeZone: 'UTC' // Ensures the date doesn't "jump" a day due to local time
    });
  }

  function getLangVer(field, lang = DEFAULT_LANG) {
    if (!field) return "";
    if (typeof field === "string") return field; // backward compatibility
    return field[lang] || field["EN"] || Object.values(field)[0] || "";
  }

  function getYAxisScale(payload, yAutoscale) {
    if (!yAutoscale) {
      return { baseline: 0, range: null };
    }

    const data = payload.data || {};
    const allY = [
      ...Object.values(data.history || {}),
      ...Object.values(data.forecast || {})
    ].map(Number).filter(Number.isFinite);

    if (!allY.length) {
      return { baseline: null, range: null };
    }

    const yMin = Math.min(...allY);
    const yMax = Math.max(...allY);
    const baseline = Math.floor(yMin - 1);

    // Keep both axis limits explicit so Plotly does not add lower-end padding
    // that separates the filled series from the bottom of the plot.
    return {
      baseline,
      range: [baseline, yMax + (yMax - baseline) * 0.05]
    };
  }

  const BEST_WINDOW_STYLES = {
    series: {
      label: "series",
      color: "rgb(37, 99, 225)",       // blue
      fill: "rgba(37, 99, 225, 0.1)",
      lineWidth: 1.5,
      lineDash: "dot"
    },
    spot: {
      label: "spot",
      color: "rgb(170, 58, 237)",     // purple
      fill: "rgba(170, 58, 237, 0.1)",
      lineWidth: 1.5,
      lineDash: "dot"
    },
    combined: {
      label: "combined",
      color: "rgb(22, 163, 74)",      // green
      fill: "rgba(22, 163, 74, 0.20)",
      lineWidth: 2,
      lineDash: "solid"
    }
  };

  function buildBestWindowShapes(bestWindows = []) {
    const shapes = [];
    const validWindows = bestWindows.filter(window =>
      window?.bin?.startTime && window?.bin?.endTime
    );

    // Draw the translucent windows first so the data traces remain readable.
    validWindows.forEach(window => {
      const style = BEST_WINDOW_STYLES[window.type];
      if (!style) return;

      shapes.push({
        type: "rect",
        xref: "x",
        yref: "paper",
        x0: window.bin.startTime,
        x1: window.bin.endTime,
        y0: 0,
        y1: 1,
        fillcolor: style.fill,
        line: { width: 0 },
        layer: "below"
      });
    });

    // Each window has a full-height start and end line. The combined window
    // uses a stronger color and thicker solid boundaries to stand out.
    validWindows.forEach(window => {
      const style = BEST_WINDOW_STYLES[window.type];
      if (!style) return;

      [window.bin.startTime, window.bin.endTime].forEach(timestamp => {
        shapes.push({
          type: "line",
          xref: "x",
          yref: "paper",
          x0: timestamp,
          x1: timestamp,
          y0: 0,
          y1: 1,
          line: {
            color: style.color,
            width: style.lineWidth,
            dash: style.lineDash
          }
        });
      });
    });

    return shapes;
  }

  function makeBestWindowLegendTraces(bestWindows = []) {
    return bestWindows.map((window, index) => {
      const style = BEST_WINDOW_STYLES[window.type];
      if (!style) return null;

      return {
        // Null coordinates create a legend swatch without drawing chart data.
        x: [null],
        y: [null],
        type: "scatter",
        mode: "lines",
        name: `Best ${style.label}`,
        line: { color: style.color, width: 4 },
        legendrank: 10 + index,
        showlegend: false,
        hoverinfo: "skip"
      };
    }).filter(Boolean);
  }

  function buildLayout(forecastStart, payloadUnit, showSpotAxis = false, bestWindows = []) {
    const theme = getMainChartTheme();

    const shapes = [];
    if (forecastStart) {
      // Keep the forecast-start line first; toggleTheme updates shapes[0].
      shapes.push({

        x1: forecastStart,

        y0: 0,
        y1: 1,

          dash: 'dash',

      });

    shapes.push(...buildBestWindowShapes(bestWindows));

    return {

  function sortEntriesByDate(history) {
    return Object.entries(history).sort(
      (a, b) => new Date(a[0]) - new Date(b[0])
    );
  }

  function makeTracesFromPayload(payload, yAutoscale) {
    const data = payload.data || {};
    const history = data.history || {};
    const forecast = data.forecast || {};
    const unit = getLangVer(payload.metadata?.unit) || "";

    const historyEntries = sortEntriesByDate(history)
    const forecastEntries = sortEntriesByDate(forecast);

    // Connect history and forecast traces by adding first forecast point to history
    if (historyEntries.length > 0 && forecastEntries.length > 0 && currentChartType == "line") {
      const firstForecast = forecastEntries[0];
      historyEntries.push(firstForecast);
    }

    // Share one scale calculation between the traces and Y-axis layout.
    const yAxisScale = getYAxisScale(payload, yAutoscale);
    currentYAxisBaseline = yAxisScale.baseline;
    currentYAxisRange = yAxisScale.range;
    const baseline = currentYAxisBaseline ?? 0;

    if (currentChartType === "bar") {
      return [
        {
          x: historyEntries.map(e => e[0]),
          y: historyEntries.map(e => e[1] - baseline),
          base: baseline,
          customdata: historyEntries.map(e => e[1]),
          type: "bar",
          name: "History",
          legendrank: 1,
          showlegend: true,
          meta: { unit: unit },
          marker: { color: "rgb(74,144,226)" },
          hovertemplate: '<b>%{customdata:.2f} %{meta.unit}</b><extra>History</extra>'
        },
        {
          x: forecastEntries.map(e => e[0]),
          y: forecastEntries.map(e => e[1] - baseline),
          base: baseline,
          customdata: forecastEntries.map(e => e[1]),
          type: "bar",
          name: "Forecast",
          legendrank: 2,
          showlegend: true,
          meta: { unit: unit },
          marker: { color: "rgb(255,140,0)" },
          hovertemplate: '<b>%{customdata:.2f} %{meta.unit}</b><extra>Forecast</extra>'
        }
      ];
    }

    // If autoscale is disabled, return simple traces without dynamic fill baseline
    if (!yAutoscale) {
      const historyTrace =  {
          x: historyEntries.map(e => e[0]),
          y: historyEntries.map(e => e[1]),
          type: "scatter",
          mode: "lines",
          name: "History",
          legendrank: 1,
          showlegend: true,
          meta: { unit: unit },
          fill: "tozeroy",
          fillcolor: "rgba(74,144,226,0.1)",
          line: { color: "rgb(74,144,226)", width: 3, shape: "spline" },
          hovertemplate: '<b>%{y:.2f} %{meta.unit}</b><extra>History</extra>'
        };
       const forecastTrace = {
          x: forecastEntries.map(e => e[0]),
          y: forecastEntries.map(e => e[1]),
          type: "scatter",
          mode: "lines",
          name: "Forecast",
          legendrank: 2,
          showlegend: true,
          meta: { unit: unit },
          fill: "tozeroy",
          fillcolor: "rgba(255,140,0,0.1)",
          line: { color: "rgb(255,140,0)", width: 3, shape: "spline" },
          hovertemplate: '<b>%{y:.2f} %{meta.unit}</b><extra>Forecast</extra>'
        };
      return [historyTrace, forecastTrace];
    }

    const historyTrace = {
      x: historyEntries.map(e => e[0]),
      y: historyEntries.map(e => e[1]),
      type: "scatter",
      mode: "lines",
      name: "History",
      legendrank: 1,
      showlegend: true,
      meta: { unit: unit },
      fill: 'tonexty',
      fillcolor: 'rgba(74, 144, 226, 0.1)',
      line: {
        color: 'rgb(74, 144, 226)', // Light blue
        width: 3,
        shape: 'spline'
      },
      hovertemplate: '<b>%{y:.2f} %{meta.unit}</b><extra>History</extra>',
    };

    const forecastTrace = {
      x: forecastEntries.map(e => e[0]),
      y: forecastEntries.map(e => e[1]),
      type: "scatter",
      mode: "lines",
      name: "Forecast",
      legendrank: 2,
      showlegend: true,
      meta: { unit: unit },
      fill: 'tonexty',
      fillcolor: 'rgba(255, 140, 0, 0.1)',
      line: {
        color: 'rgb(255, 140, 0)', // strong orange
        width: 3,
        shape: 'spline'
      },
      marker: { size: 6, symbol: 'circle', color: 'rgb(255, 140, 0)' },
      hovertemplate: '<b>%{y:.2f} %{meta.unit}</b><extra>Forecast</extra>',
    };

    const historyBaseline = {
      x: historyEntries.map(e => e[0]),
      y: Array(historyEntries.length).fill(baseline),
      type: "scatter",
      mode: "lines",
      showlegend: false,
      line: { width: 0 },
      hoverinfo: "skip"
    };

    const forecastBaseline = {
      x: forecastEntries.map(e => e[0]),
      y: Array(forecastEntries.length).fill(baseline),
      type: "scatter",
      mode: "lines",
      showlegend: false,
      line: { width: 0 },
      hoverinfo: "skip"
    };

    return [historyBaseline, historyTrace, forecastBaseline, forecastTrace];
  }

  // The API timestamps are already in local time; just remove the timezone offset.
  function getForecastTimeRange(payload, forecastOnly = false) {
    const data = payload.data || {};
    const timestamps = [
      ...( forecastOnly ? [] : Object.keys(data.history || {})),
      ...Object.keys(data.forecast || {})
    // Remove timezone information for naive timestamps (split at '+')
    ].map(timestamp => timestamp.split("+")[0]).sort();

    if (!timestamps.length) return null;
    return { startTime: timestamps[0], endTime: timestamps[timestamps.length - 1] };
  }

  function makeSpotPriceTraces(payload, range) {
    const data = payload.data || {};
    const toEntries = obj => Object.entries(obj || {})
      .filter(([timestamp]) => {
        // Remove timezone information for naive timestamps (split at '+')
        const localTime = timestamp.split("+")[0];
        return localTime >= range.startTime && localTime <= range.endTime;
      })
      .sort();

    const historyEntries = toEntries(data.history);
    const forecastEntries = toEntries(data.forecast);
    const traces = [];

    // Connect history and day-ahead traces by adding first forecast point to history
    if (historyEntries.length > 0 && forecastEntries.length > 0) {
      const firstForecast = forecastEntries[0];
      historyEntries.push(firstForecast);
    }

    // Use dashed lines when line graphs are on and solid line with bar charts
    // Options: "solid", "dot", "dash", "longdash", "dashdot", or "longdashdot"
    let lineStyle = currentChartType === "line" ? "dot" : "solid";

    if (historyEntries.length) {
      traces.push({
        x: historyEntries.map(e => e[0]),
        y: historyEntries.map(e => e[1]),
        type: "scatter",
        mode: "lines",
        name: "Spot price (history)",
        yaxis: "y2",
        line: { color: "rgb(0, 130, 110)", width: 3, dash: lineStyle },
        hovertemplate: '<b>%{y:.2f} €/MWh</b><extra>Spot price (History)</extra>'
      });
    }

    if (forecastEntries.length) {
      traces.push({
        x: forecastEntries.map(e => e[0]),
        y: forecastEntries.map(e => e[1]),
        type: "scatter",
        mode: "lines",
        name: "Spot price (day-ahead)",
        yaxis: "y2",
        line: { color: "rgb(0, 200, 165)", width: 3, dash: lineStyle },
        hovertemplate: '<b>%{y:.2f} €/MWh</b><extra>Spot price (Day-ahead)</extra>'
      });
    }

    return traces;
  }

  const SPOT_PRICE_CACHE_TTL = 10 * 60 * 1000; // 10 minutes in milliseconds
  const spotPriceLoading = document.getElementById("spotprice-loading");

  function setSpotPriceLoading(loading) {
    spotPriceLoading.classList.toggle("visible", loading);
  }

  function readSpotPriceCache(url) {
    const key = `spotprice:${url}`;

    try {
      const cachedValue = localStorage.getItem(key);
      if (!cachedValue) return null;

      const cached = JSON.parse(cachedValue);

      // Check expiration only when this cache entry is read
      if (!Number.isFinite(cached.savedAt) ||
          Date.now() - cached.savedAt >= SPOT_PRICE_CACHE_TTL) {
        localStorage.removeItem(key);
        return null;
      }

      return cached;
    } catch (error) {
      return null;
    }
  }

  function writeSpotPriceCache(url, payload) {
    try {
      localStorage.setItem(`spotprice:${url}`, JSON.stringify({
        savedAt: Date.now(),
        payload
      }));
    } catch (error) {
      console.warn("Could not cache spot prices locally:", error);
    }
  }

  async function fetchSpotPricePayload(forecastPayload, forecastOnly = false) {
    const range = getForecastTimeRange(forecastPayload, forecastOnly);
    if (!range) return null;

    const params = new URLSearchParams({
      date_from: range.startTime,
      date_to: range.endTime,
      tz: DEFAULT_TZ
    });
    const url = `${API_BASE}/spotprice/range?${params.toString()}`;
    const cached = readSpotPriceCache(url);

    if (cached && cached.payload) {
      currentSpotPricePayload = cached.payload;
      return cached.payload;
    }

    setSpotPriceLoading(true);
    try {
      const payload = await fetchJson(url);
      writeSpotPriceCache(url, payload);
      currentSpotPricePayload = payload;
      return payload;
    } catch (error) {
      console.warn("Could not load spot prices:", error);
      currentSpotPricePayload = null;
      return null;
    } finally {
      setSpotPriceLoading(false);
    }
  }

  async function fetchSpotPriceTraces(forecastPayload) {
    if (!spotPriceToggle.checked) return [];

    const range = getForecastTimeRange(forecastPayload);
    if (!range) return [];

    const payload = await fetchSpotPricePayload(forecastPayload);
    return payload ? makeSpotPriceTraces(payload, range) : [];
  }

  function initHistoryOptionsFromInfo(infoPayload, seriesKey, preserveSelection = false) {
    const hist = infoPayload.history.find(h => h.series_key === seriesKey);
    if (!hist) return;

    const start = new Date(hist.history_start);
    const end   = new Date(hist.history_end);

    const totalDays = Math.max(1, Math.floor((end - start) / (1000 * 60 * 60 * 24)));
    // const maxWeeks = Math.floor(totalDays / 7);
    const maxWeeks = 4; // limit to 4 weeks for usability

    const previousValue = preserveSelection ? historySelect.value : null;

    historySelect.innerHTML = "";

    // No history
    const opt = document.createElement("option");
    opt.value = `0D`;
    opt.textContent = `None`;
    historySelect.appendChild(opt);

    // Up to 7 days
    const dayLimit = Math.min(7, totalDays);
    for (let d = 1; d <= dayLimit; d++) {
      const opt = document.createElement("option");
      opt.value = `${d}D`;
      opt.textContent = `${d} day${d > 1 ? "s" : ""}`;
      historySelect.appendChild(opt);
    }

    // Weeks from 2 to max
    for (let w = 2; w <= maxWeeks; w++) {
      const opt = document.createElement("option");
      opt.value = `${w}W`;
      opt.textContent = `${w} week${w > 1 ? "s" : ""}`;
      historySelect.appendChild(opt);
    }

    // Try to restore previous selection if still valid
    if (preserveSelection && previousValue &&
        historySelect.querySelector(`option[value="${previousValue}"]`)) {
      historySelect.value = previousValue;
    } else {
      // default selection
      if (historySelect.querySelector('option[value="1D"]')) {
        historySelect.value = "1D";
      } else if (historySelect.options.length > 0) {
        historySelect.value = historySelect.options[historySelect.options.length - 1].value;
      }
    }
  }

  function initSeriesButtons(infoPayload) {
    setChartLoading(true, "Loading forecast…");
    seriesButtonsContainer.innerHTML = "";

    infoPayload.series.forEach((s, idx) => {
      const btn = document.createElement("button");
      const fullName = getLangVer(s.name);

      btn.textContent = fullName
      btn.title = fullName
      btn.className = "series-button";
      btn.dataset.seriesKey = s.series_key;

      if (s.series_key === currentSeriesKey || (!currentSeriesKey && idx === 0)) {
        currentSeriesKey = s.series_key;
        btn.classList.add("active");
      }

      btn.addEventListener("click", () => {
        // closeControlsDrawerAfterSelection();
        currentSeriesKey = s.series_key;

        // update active state
        document.querySelectorAll(".series-button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        // rebuild history options for the selected series, preserving selection if possible
        initHistoryOptionsFromInfo(infoPayload, currentSeriesKey, true);

        // reload latest forecast for this series
        loadLatestForecast();
      });

      seriesButtonsContainer.appendChild(btn);
    });

    // Initialize history dropdown for currently selected series
    initHistoryOptionsFromInfo(infoPayload, currentSeriesKey);
  }

  async function fetchJson(url) {
    const response = await fetch(url, {
      headers: {
        "bypass-tunnel-reminder": "true"
      }
    });
    if (!response.ok) {
      throw new Error(`HTTP error! Status: ${response.status}`);
    }
    return response.json();
  }

  async function fetchInfo() {
    const url = `${API_BASE}/info`;
    const response = await fetch(url, {
      headers: {
        "bypass-tunnel-reminder": "true"
      }
    });
    if (!response.ok) {
      throw new Error(`Failed to load /info: ${response.status}`);
    }
    return response.json();
  }

  async function loadForecastByDate(dateStr) {
    setChartLoading(true, "Loading forecast…");
    if (!dateStr) {
      chartDiv.innerHTML = `<p style="color:red;">Please select a forecast date.</p>`;
      return;
    }

    const params = new URLSearchParams({
      series_key: currentSeriesKey,
      date: dateStr,
      history_len: historySelect.value || "3D",
      tz: DEFAULT_TZ
    });

    const url = `${API_BASE}/forecast?${params.toString()}`;

    try {
      const payload = await fetchJson(url);

      if (payload.error) {
        chartDiv.innerHTML = `<p style="color:red;">${payload.error}</p>`;
        return;
      }

      currentForecastRequest = { mode: "date", date: dateStr };
      currentForecastPayload = payload;
      currentSpotPricePayload = null;
      const traces = makeTracesFromPayload(payload, yAutoscale);
      const spotTraces = await fetchSpotPriceTraces(payload);
      const showSpotPrices = spotTraces.length > 0
      traces.push(...spotTraces);
      const forecastStart = payload.metadata && payload.metadata.forecast_start;
      const titleDate = formatPrettyDate(forecastStart);
      const seriesName = getLangVer(payload.metadata?.name).toLowerCase();
      const title = `${seriesName.charAt(0).toUpperCase() + seriesName.slice(1)} for ${titleDate}`;

      document.getElementById("chart-title").textContent = title;
      document.getElementById("chart-container").classList.toggle("has-spotprices", showSpotPrices);

      // Highlight the best series window, plus spot and combined windows
      // only when spot prices are actually displayed.
      const bestWindows = getBestTimeWindows(payload, showSpotPrices);
      renderBestWindowsSummary(bestWindows, payload);
      traces.push(...makeBestWindowLegendTraces(bestWindows));

      const payloadUnit = getLangVer(payload.metadata?.unit);
      const layout = buildLayout(forecastStart, payloadUnit, showSpotPrices, bestWindows);
      const config = { 
        responsive: true, 
        displaylogo: false, 
        displayModeBar: false,
        scrollZoom: false
        };
      await Plotly.newPlot(chartDiv, traces, layout, config);
      chartDiv.classList.toggle("bar-hover", currentChartType === "bar");
      attachRangeSliderHoverHandler();
      attachBarSpikeSizingHandler();
      setChartLoading(false);
      displayGeneratedAt(payload.metadata?.generated_at);
    } catch (error) {
      chartDiv.innerHTML = `<p style="color:red;">Could not load forecast data. ${error.message}</p>`;
      console.error("Error loading forecast by date:", error);
      setChartLoading(false);
    }
  }

  async function loadLatestForecast() {
    const params = new URLSearchParams({
      series_key: currentSeriesKey,
      history_len: historySelect.value || "3D",
      tz: DEFAULT_TZ
    });

    const url = `${API_BASE}/forecast/latest?${params.toString()}`;

    try {
      const payload = await fetchJson(url);

      if (payload.error) {
        chartDiv.innerHTML = `<p style="color:red;">${payload.error}</p>`;
        return;
      }

      currentForecastRequest = { mode: "latest", date: null };
      currentForecastPayload = payload;
      currentSpotPricePayload = null;
      const traces = makeTracesFromPayload(payload, yAutoscale);
      const spotTraces = await fetchSpotPriceTraces(payload);
      const showSpotPrices = spotTraces.length > 0
      traces.push(...spotTraces);
      const forecastStart = payload.metadata && payload.metadata.forecast_start;
      const titleDate = formatPrettyDate(forecastStart);
      const seriesName = getLangVer(payload.metadata?.name).toLowerCase();
      const title = `${seriesName.charAt(0).toUpperCase() + seriesName.slice(1)} for ${titleDate}`
      document.getElementById("chart-title").textContent = title;
      document.getElementById("chart-container").classList.toggle("has-spotprices", showSpotPrices);

      // Highlight the best series window, plus spot and combined windows
      // only when spot prices are actually displayed.
      const bestWindows = getBestTimeWindows(payload, showSpotPrices);
      renderBestWindowsSummary(bestWindows, payload);
      traces.push(...makeBestWindowLegendTraces(bestWindows));

      const payloadUnit = getLangVer(payload.metadata?.unit);
      const layout = buildLayout(forecastStart, payloadUnit, showSpotPrices, bestWindows);
      const config = { 
        responsive: true, 
        displaylogo: false, 
        displayModeBar: false,
        scrollZoom: false
        };
      await Plotly.newPlot(chartDiv, traces, layout, config);
      chartDiv.classList.toggle("bar-hover", currentChartType === "bar");
      attachRangeSliderHoverHandler();
      attachBarSpikeSizingHandler();
      setChartLoading(false);
      displayGeneratedAt(payload.metadata?.generated_at);
    } catch (error) {
      chartDiv.innerHTML = `<p style="color:red;">Could not load latest forecast. ${error.message}</p>`;
      console.error("Error loading latest forecast:", error);
      setChartLoading(false);
    }
  }

  function toggleTheme() {
    currentTheme = currentTheme === "light" ? "dark" : "light";

    document.body.classList.toggle("dark-theme");

    const theme = getMainChartTheme();

    const updates = {
      template: theme.template,

      font: {
        size: 12,
        color: theme.text
      },

      "legend.font.color": theme.text,
      "xaxis.gridcolor": theme.grid,
      "xaxis.zerolinecolor": theme.grid,
      "xaxis.tickfont.color": theme.muted,
      "xaxis.rangeslider.bordercolor": theme.grid,
      "yaxis.gridcolor": theme.grid,
      "yaxis.zerolinecolor": theme.grid,
      "yaxis.tickfont.color": theme.muted,
      "yaxis2.tickfont.color": theme.muted,
      "hoverlabel.bgcolor": theme.hoverBg,
      "hoverlabel.bordercolor": theme.hoverBorder,
      "hoverlabel.font.color": theme.hoverText,
    };

    if (currentChartType === "bar") {
      updates["xaxis.spikecolor"] = theme.fit;
    }

    if (chartDiv.layout?.shapes?.length) {
      updates["shapes[0].line.color"] = theme.fit;
    }

    Plotly.relayout(chartDiv, updates);

    statisticsDialog.refreshTheme();
  }

  function clearHoverOnRangeSlider(eventData) {
      const rangeSliderChanged = Array.isArray(eventData["xaxis.range"]);

      const xAxisRangeChanged =
          rangeSliderChanged ||
          Object.prototype.hasOwnProperty.call(eventData, "xaxis.range[0]") ||
          Object.prototype.hasOwnProperty.call(eventData, "xaxis.range[1]") ||
          eventData["xaxis.autorange"] === true;

      if (rangeSliderChanged) {
          Plotly.Fx.unhover(chartDiv);
      }

      if (xAxisRangeChanged) {
          scheduleBarSpikeUpdate();
      }
  }

  function attachRangeSliderHoverHandler() {
      // Prevent duplicate handlers
      if (typeof chartDiv.removeListener === "function") {
          chartDiv.removeListener(
              "plotly_relayout",
              clearHoverOnRangeSlider
          );
      }

      chartDiv.on("plotly_relayout", clearHoverOnRangeSlider);
  }

  // --- Dynamic bar hover highlight width ---
  let barSpikeUpdatePending = false;
  let barSpikeHandlerAttached = false;

  function updateBarSpikeThickness() {
      if (currentChartType !== "bar") return;

      // Find maximum rendered bar width
      const barPaths = chartDiv.querySelectorAll(
          ".barlayer .trace.bars .points path"
      );

      const maxWidth = Math.max(
          ...Array.from(barPaths, path =>
              path.getBoundingClientRect().width
          ).filter(width => Number.isFinite(width) && width > 1)
      );

      if (!Number.isFinite(maxWidth)) return;

      const thickness = Math.max(2, Math.ceil(maxWidth));

      // Avoid unnecessary Plotly redraws.
      const currentThickness =
          chartDiv._fullLayout?.xaxis?.spikethickness;

      if (
          Number.isFinite(currentThickness) &&
          Math.abs(currentThickness - thickness) < 0.5
      ) {
          return;
      }

      Plotly.relayout(chartDiv, {
          "xaxis.spikethickness": thickness
      });
  }

  function scheduleBarSpikeUpdate() {
      if (currentChartType !== "bar" || barSpikeUpdatePending) return;

      barSpikeUpdatePending = true;

      requestAnimationFrame(() => {
          barSpikeUpdatePending = false;

          updateBarSpikeThickness();
      });
  }

  function attachBarSpikeSizingHandler() {
      // Attach only once.
      if (!barSpikeHandlerAttached && typeof chartDiv.on === "function") {
          chartDiv.on(
              "plotly_afterplot",
              scheduleBarSpikeUpdate
          );

          barSpikeHandlerAttached = true;
      }

      // Calculate initial width after chart creation.
      scheduleBarSpikeUpdate();
  }

  // --- Touch scrubbing with double-tap zoom reset ---
  let touchScrubbing = false;

  let lastTapTime = 0;
  let lastTapX = 0;
  let lastTapY = 0;
  let lastTapIdentifier = null;

  let touchStartX = 0;
  let touchStartY = 0;
  let touchMoved = false;


  function getTouchPlotPosition(touch) {
      const plotArea = chartDiv.querySelector(".nsewdrag");
      if (!plotArea) return null;

      const rect = plotArea.getBoundingClientRect();

      return {
          xpx: touch.clientX - rect.left,
          ypx: touch.clientY - rect.top
      };
  }


  function resetChartZoom() {
      const update = {
          "xaxis.autorange": true,
          "yaxis.autorange": !currentYAxisRange
      };

      // Restore the same explicit autoscaled range used when the chart was drawn.
      if (currentYAxisRange) {
          update["yaxis.range"] = currentYAxisRange;
      }

      // Reset the secondary axis only when spot-price traces exist
      const hasSpotPriceAxis = chartDiv.data &&
          chartDiv.data.some(trace => trace.yaxis === "y2");

      if (hasSpotPriceAxis && chartDiv._fullLayout &&
          chartDiv._fullLayout.yaxis2) {
          update["yaxis2.autorange"] = true;
      }

      Plotly.relayout(chartDiv, update);

      Plotly.Fx.unhover(chartDiv);
  }

  function displayGeneratedAt(timestamp) {
    const element = document.getElementById('forecast-generated-at');

    if (!timestamp) {
        element.textContent = '';
        return;
    }

    const date = new Date(timestamp);

    if (isNaN(date.getTime())) {
        element.textContent = '';
        return;
    }

    const formatted = new Intl.DateTimeFormat(undefined, {
        dateStyle: 'medium',
        timeStyle: 'long'
    }).format(date);

    element.textContent = `Forecast updated: ${formatted}`;
  }

  function isEmpty(value) {
    if (Array.isArray(value)) {
      return value.length === 0;
    }

    if (value && typeof value === 'object') {
      return Object.keys(value).length === 0;
    }

    return true;
  }

  function getSortedBins(payload, binLen, higherIsBetter = false) {
    if (!payload?.data || !Number.isInteger(binLen) || binLen < 1) return [];

    const data = payload.data;
    const forecast = data.forecast || {};
    const history = data.history || {};

    // Primarily use forecast data, but if it is not available use history data.
    const sortData = isEmpty(forecast) ? history : forecast;
    const sortedEntries = sortEntriesByDate(sortData);
    const avgBins = [];

    for (let i = 0; i <= sortedEntries.length - binLen; i++) {
      const window = sortedEntries.slice(i, i + binLen);
      const values = window.map(entry => Number(entry[1]));
      if (values.some(value => !Number.isFinite(value))) continue;

      const avg = values.reduce((sum, value) => sum + value, 0) / binLen;
      avgBins.push({
        startTime: window.at(0)[0],
        endTime: window.at(-1)[0],
        average: avg
      });
    }

    // Rank the best averages first: low-to-high for emissions/prices,
    // high-to-low for renewable and domestic shares.
    avgBins.sort((a, b) => higherIsBetter
      ? b.average - a.average
      : a.average - b.average
    );

    // Rank zero is the best window, regardless of optimization direction.
    avgBins.forEach((bin, index) => { bin.rank = index; });
    return avgBins;
  }

  function getBestTimeWindows(payload, includeSpotWindows = false) {
    // Only these two series are higher-is-better (desc. order); emissions remains lower-is-better.
    const higherIsBetterTypes = [
      "renew_production_share",
      "domestic_production_share"
      ];

    const higherIsBetter = higherIsBetterTypes.includes(currentSeriesKey);
    const seriesBins = getSortedBins(payload, 3, higherIsBetter);
    const bestWindows = [];

    // Get best series time window
    if (seriesBins[0]) {
      bestWindows.push({ type: "series", bin: seriesBins[0] });
    }

    // Spot and combined rankings are only needed when the spot overlay is active.
    // fetchSpotPriceTraces has already populated currentSpotPricePayload in that case.
    if (includeSpotWindows && currentSpotPricePayload) {
      const spotBins = getSortedBins(currentSpotPricePayload, 3, false);

      // Get best spot price time window
      if (spotBins[0]) {
        bestWindows.push({ type: "spot", bin: spotBins[0] });
      }

      // Get best combined time window
      const bestCombinedBin = findBestCombinedBin(seriesBins, spotBins, "spot");
      if (bestCombinedBin) {
        bestWindows.push({ type: "combined", bin: bestCombinedBin });
      }
    }

    return bestWindows;
  }

  function findBestCombinedBin(seriesBins, spotBins, tieBreaker = "spot") {
      // Index seriesBins by startTime and endTime
      const seriesMap = new Map();

      // Assing a key for each object for fast lookup
      seriesBins.forEach(seObj => {
          const key = `${seObj.startTime}_${seObj.endTime}`;
          seriesMap.set(key, seObj);
      });

      const combBins = [];

      spotBins.forEach(spObj => {
          const key = `${spObj.startTime}_${spObj.endTime}`;
          const seObj = seriesMap.get(key);

          if (seObj) {
              combBins.push({
                  startTime: seObj.startTime,
                  endTime: seObj.endTime,
                  seriesAvg: seObj.average,
                  spotAvg: spObj.average,
                  binRank: seObj.rank + spObj.rank,
                  // Required for breaking rank ties
                  seriesRank: seObj.rank,
                  spotRank: spObj.rank
              });
          }
      });

      // Sort by combined rank, then use the selected tie-breaker if needed
      combBins.sort((a, b) => {
          if (a.binRank !== b.binRank) {
              return a.binRank - b.binRank;
          }

          if (tieBreaker === "spot") {
              return a.spotRank - b.spotRank;
          }

          return a.seriesRank - b.seriesRank;
      });

      // Return the "win-win" time window with the lowest combined rank
      return combBins[0] ?? null;
  }

  function getBestWindowMetric(payload) {

    if (currentSeriesKey === "renew_production_share") {
      return {
        title: "Highest renewable share",
        averageLabel: "Avg. renewable share",
        combinedTitle: "Highest renewable share and lowest spot prices"
      };
    }

    if (currentSeriesKey === "domestic_production_share") {
      return {
        title: "Highest domestic share",
        averageLabel: "Avg. domestic share",
        combinedTitle: "Highest domestic share and lowest spot prices"
      };
    }

    if (currentSeriesKey === "consumption_emissions") {
      return {
        title: "Lowest emissions",
        averageLabel: "Avg. emissions",
        combinedTitle: "Lowest emissions and spot prices"
      };
    }

    seriesName = getLangVer(payload?.metadata?.name).trim();
    const fallbackName = seriesName || "Series values";

    return {
      title: `Lowest ${fallbackName.toLowerCase()}`,
      averageLabel: fallbackName,
      combinedTitle: `Lowest ${fallbackName.toLowerCase()} and spot prices`
    };
  }

  function getBestWindowDateTimeParts(timestamp) {
    const raw = String(timestamp || "");
    const [datePart, timePart = ""] = raw.includes("T")
      ? raw.split("T")
      : raw.split(" ");

    const date = new Date(`${datePart}T00:00:00Z`);

    const dateLabel = Number.isNaN(date.getTime())
      ? datePart
      : new Intl.DateTimeFormat(undefined, {
          day: "numeric",
          month: "short",
          timeZone: "UTC"
        }).format(date);

    // Keep the API's local time rather than converting it to another timezone.
    const clock = timePart
      .replace(/(?:Z|[+-]\d{2}:?\d{2})$/, "")
      .slice(0, 5);

    return { datePart, dateLabel, clock };
  }

  function formatBestWindowRange(startTime, endTime) {
    const start = getBestWindowDateTimeParts(startTime);
    const end = getBestWindowDateTimeParts(endTime);

    if (start.datePart === end.datePart) {
      return `${start.dateLabel}, ${start.clock}–${end.clock}`;
    }

    return `${start.dateLabel} ${start.clock} – ${end.dateLabel} ${end.clock}`;
  }

  function formatBestWindowAverage(value, unit = "") {
    const numericValue = Number(value);

    if (!Number.isFinite(numericValue)) {
      return "—";
    }

    return `${numericValue.toFixed(2)}${unit ? ` ${unit}` : ""}`;
  }

  function renderBestWindowsSummary(bestWindows = [], payload = {}) {
    bestWindowsSummary.replaceChildren();

    if (!bestWindows.length) return;

    const metric = getBestWindowMetric(payload);
    const seriesUnit = getLangVer(payload.metadata?.unit);

    bestWindows.forEach(window => {
      const style = BEST_WINDOW_STYLES[window.type];

      if (!style || !window.bin) return;

      const card = document.createElement("section");
      card.className = "best-window-card";

      // Match the corresponding chart highlight.
      card.style.setProperty("--best-window-color", style.color);
      card.style.setProperty("--best-window-fill", style.fill);

      const title = document.createElement("p");
      title.className = "best-window-card-title";

      const range = document.createElement("p");
      range.className = "best-window-card-range";
      range.textContent = formatBestWindowRange(
        window.bin.startTime,
        window.bin.endTime
      );

      const average = document.createElement("p");
      average.className = "best-window-card-average";

      if (window.type === "series") {
        title.textContent = metric.title;
        average.textContent =
          `${metric.averageLabel}: ${formatBestWindowAverage(window.bin.average, seriesUnit)}`;
      }

      if (window.type === "spot") {
        title.textContent = "Lowest spot prices";
        average.textContent =
          `Avg. spot price: ${formatBestWindowAverage(window.bin.average, "€/MWh")}`;
      }

      if (window.type === "combined") {
        title.textContent = metric.combinedTitle;
        average.textContent =
          `${metric.averageLabel}: ${formatBestWindowAverage(window.bin.seriesAvg, seriesUnit)}\n` +
          `Avg. spot price: ${formatBestWindowAverage(window.bin.spotAvg, "€/MWh")}`;
      }

      card.append(title, range, average);
      bestWindowsSummary.appendChild(card);
    });
  }

  // --- Statistics dialog integration ---
  async function calculateAndShowStatistics() {
    statisticsDialog.open();
    statisticsDialog.setLoading("Preparing the current data set…");

    if (!currentForecastPayload) {
      statisticsDialog.setStatus(
        "No forecast data is currently loaded. Load a forecast and try again.",
        true
      );
      return;
    }

    const forecastSnapshot = currentForecastPayload;
    statisticsDialog.setLoading("Loading spot prices and calculating statistics…");

    try {
      const spotPayload = await fetchSpotPricePayload(forecastSnapshot);

      if (forecastSnapshot !== currentForecastPayload) {
        statisticsDialog.setStatus(
          "The forecast changed while statistics were being calculated. Please try again.",
          true
        );
        return;
      }

      statisticsDialog.render(forecastSnapshot, spotPayload, {
        seriesKey: currentSeriesKey
      });
    } catch (error) {
      console.error("Statistics calculation failed:", error);
      statisticsDialog.setStatus(
        "Unable to load spot prices or calculate statistics. Please try again.",
        true
      );
      statisticsDialog.clearCharts(
        "Charts are unavailable because the spot-price data could not be loaded."
      );
    }
  }

  // Touch start
  chartDiv.addEventListener("touchstart", event => {
      if (event.touches.length !== 1) return;

      const touch = event.touches[0];
      const plotArea = chartDiv.querySelector(".nsewdrag");

      if (!plotArea) return;

      const rect = plotArea.getBoundingClientRect();

      // Only handle touches inside the main plotting area
      if (
          touch.clientX < rect.left ||
          touch.clientX > rect.right ||
          touch.clientY < rect.top ||
          touch.clientY > rect.bottom
      ) return;

      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      touchMoved = false;
      touchScrubbing = true;

      event.preventDefault();
      event.stopPropagation();

      const pos = getTouchPlotPosition(touch);

      if (pos) {
          Plotly.Fx.hover(chartDiv, pos);
      }

  }, { capture: true, passive: false });


  // Touch move
  chartDiv.addEventListener("touchmove", event => {
      if (!touchScrubbing || event.touches.length !== 1) return;

      const touch = event.touches[0];

      if (
          Math.hypot(
              touch.clientX - touchStartX,
              touch.clientY - touchStartY
          ) > 10
      ) {
          touchMoved = true;
      }

      event.preventDefault();
      event.stopPropagation();

      const pos = getTouchPlotPosition(touch);

      if (pos) {
          Plotly.Fx.hover(chartDiv, pos);
      }

  }, { passive: false });


  // Touch end: detect completed taps and double taps
  chartDiv.addEventListener("touchend", event => {
    // Ignore if not scrubbing, if the finger moved, if another finger is still down,
    // or if more than one touch ended simultaneously
    if (
      !touchScrubbing ||
      touchMoved ||
      event.touches.length > 0 ||
      event.changedTouches.length !== 1
    ) {
      touchScrubbing = false;
      lastTapTime = 0;
      lastTapIdentifier = null;
      return;
    }

    const touch = event.changedTouches[0];
    const now = Date.now();

    const isDoubleTap =
        lastTapTime > 0 &&
        touch.identifier === lastTapIdentifier &&
        now - lastTapTime > 50 &&
        now - lastTapTime < 600 &&
        Math.hypot(
            touch.clientX - lastTapX,
            touch.clientY - lastTapY
        ) < 40;

    if (isDoubleTap) {
        lastTapTime = 0;
        touchScrubbing = false;
        lastTapIdentifier = null;
        resetChartZoom();
        return;
    }

    // Remember the first tap and which finger made it
    lastTapTime = now;
    lastTapX = touch.clientX;
    lastTapY = touch.clientY;
    lastTapIdentifier = touch.identifier;
    touchScrubbing = false;
  }, { capture: true });


  // Touch cancel
  document.addEventListener("touchcancel", () => {
      touchScrubbing = false;
      touchMoved = false;
      lastTapTime = 0;
  });

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      chartDiv.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }

  // --- Event Listeners ---
  calculateStatisticsButton.addEventListener("click", calculateAndShowStatistics);

  loadButton.addEventListener('click', () => {
    // closeControlsDrawerAfterSelection();
    loadForecastByDate(forecastDateInput.value);
  });

  latestButton.addEventListener('click', () => {
    // closeControlsDrawerAfterSelection();
    loadLatestForecast();
  });

  themeToggleButton.addEventListener('click', () => {
    // closeControlsDrawerAfterSelection();
    toggleTheme();
  });

  spotPriceToggle.addEventListener('change', () => {
    spotPriceToggle.setAttribute("aria-checked", String(spotPriceToggle.checked));

    if (currentForecastRequest.mode === "date") {
      loadForecastByDate(currentForecastRequest.date);
    } else {
      loadLatestForecast();
    }
  });

  historySelect.addEventListener('change', () => {
    // closeControlsDrawerAfterSelection();
    loadLatestForecast();
  });

  yAutoscaleToggle.addEventListener('change', () => {
    yAutoscaleToggle.setAttribute("aria-checked", String(yAutoscaleToggle.checked));
    yAutoscale = yAutoscaleToggle.checked;
    loadLatestForecast();
  });

  chartTypeToggle.addEventListener('change', () => {
    currentChartType = chartTypeToggle.checked ? "bar" : "line";
    chartTypeToggle.setAttribute("aria-checked", String(chartTypeToggle.checked));

    if (currentForecastRequest.mode === "date") {
      loadForecastByDate(currentForecastRequest.date);
    } else {
      loadLatestForecast();
    }
  });

  // Clear sticky Plotly hover labels when clicking/touching outside the chart
  document.addEventListener("pointerdown", (event) => {
      if (!chartDiv.contains(event.target)) {
          Plotly.Fx.hover(chartDiv, []);
      }
  });

  // document.addEventListener('fullscreenchange', () => {
  //   Plotly.Plots.resize(chart);
  // });

  async function initialize() {
    setChartLoading(true, "Loading forecast options…");
    const today = new Date();
    forecastDateInput.value = formatDate(today);

    try {
      const infoPayload = await fetchInfo();
      initSeriesButtons(infoPayload);
    } catch (err) {
      console.error("Could not initialize series/history options:", err);
    }

    await loadLatestForecast();
  }

  document.addEventListener("DOMContentLoaded", () => {
      if (!window.Plotly) {
          setChartLoading(false);
          chartDiv.textContent =
              "Could not load the chart library. Please check your connection and reload the page.";
          return;
      }

      initialize();
  }, { once: true });
</script>
