<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhanced Forecast Chart</title>
  <link rel="icon" href="https://flaire.fi/wp-content/uploads/2024/01/cropped-flaire-favicon-32x32.png" sizes="32x32" />
  <link rel="icon" href="https://flaire.fi/wp-content/uploads/2024/01/cropped-flaire-favicon-192x192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="https://flaire.fi/wp-content/uploads/2024/01/cropped-flaire-favicon-180x180.png" />
  <meta name="msapplication-TileImage" content="https://flaire.fi/wp-content/uploads/2024/01/cropped-flaire-favicon-270x270.png" />
  <script defer
          src="https://cdn.plot.ly/plotly-basic-4.3.0.min.js"
          charset="utf-8">
  </script>
  <style>
    /* Fluid typography for headings */
    :root {
      --heading-fluid: clamp(22px, 4.5vw, 36px);
    }

    /* Default light theme styles */
    body {
      background-color: #f4f4f9;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      min-height: 100vh;
      padding: 20px 5px 10px 5px;
      box-sizing: border-box;
      transition: background-color 0.2s, color 0.2s;
      position: relative;
    }

    /* Header container for title */
    .header-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      position: relative;
    }

    /* Logo styling and positioning */
    .logo {
      position: absolute;
      left: 20px;
      top: 20px;
      height: clamp(35px, 5vw, 50px);
      width: auto;
      transition: filter 0.2s;
    }

    /* Invert logo colors for light theme */
    body.light-theme .logo {
      filter: invert(1);
    }

    body.dark-theme .logo {
      filter: none;
    }

    h1 {
      color: #000;
      font-weight: 350;
      margin: 0;
      font-size: var(--heading-fluid);
    }

    h2 {
      font-weight: 350;
      margin: 0;
      font-size: max(var(--heading-fluid) - 10px, 16px);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .controls-time {
      display: flex;
      gap: 15px;
      font-size: 16px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .control-field {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .controls-action {
      display: flex;
      gap: 15px;
      justify-content: center;
      align-items: center;
    }

    .controls label,
    .controls input,
    .controls button {
      font-size: 16px;
    }

    .controls button {
      padding: 8px 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
      background-color: #fff;
      color: #333;
      cursor: pointer;
    }

    .series-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .series-button {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid #ccc;
      background-color: #fff;
      cursor: pointer;
      font-size: 14px;

      /* Text formatting Logic */
      max-width: 240px;
      white-space: wrap;
      vertical-align: middle;
    }

    .series-button.active {
      background-color: #4a90e2;
      color: #fff;
      border-color: #4a90e2;
    }

    body.dark-theme .series-button {
      background-color: #222;
      color: #eee;
      border-color: #555;
    }

    body.dark-theme .series-button.active {
      background-color: #4a90e2;
      color: #fff;
      border-color: #4a90e2;
    }

    #forecast-date,
    #history-select {
      font-size: 16px;
    }

    #chart-title {
      margin: 0 0 15px 0;
      font-weight: 350;
      text-align: center;
    }

    #chart-container {
      --spot-extra-height: 0px;

      width: 100%;
      max-width: 1000px;
      height: calc(clamp(300px, 55vh, 700px) + var(--spot-extra-height));
      position: relative;
    }

    #chart-container.has-spotprices {
      --spot-extra-height: clamp(0px, calc((700px - 100vw) * 0.25), 100px);
    }

    /* General chart loading overlay */
    #chart-loading {
        position: absolute;
        inset: 0;
        z-index: 90;

        display: flex;
        flex-direction: row-reverse;
        align-items: center;
        justify-content: center;
        gap: 12px;

        background: rgba(244, 244, 249, 0.88);
        color: #333;

        font-size: 16px;
        font-weight: 600;
    }

    #chart-loading.is-hidden {
        display: none;
    }

    /* Loading spinner */
    .chart-loading-spinner {
        width: 22px;
        height: 22px;
        border: 4px solid rgba(74, 144, 226, 0.2);
        border-top-color: #4a90e2;
        border-radius: 50%;
        animation: chart-loading-spin 0.8s linear infinite;
    }

    @keyframes chart-loading-spin {
        to {
            transform: rotate(360deg);
        }
    }

    @media (prefers-reduced-motion: reduce) {
    #chart-loading::before {
        animation: none;
      }
    }

    /* Dark theme */
    body.dark-theme #chart-loading {
        background: rgba(17, 17, 17, 0.88);
        color: #eee;
    }

    #spotprice-loading {
        display: none;
        position: absolute;
        inset: 0;
        flex-direction: row-reverse;
        align-items: center;
        justify-content: center;
        gap: 12px;

        background: rgba(244, 244, 249, 0.7);
        color: #333;

        z-index: 100;
        pointer-events: auto;
        cursor: wait;
        font-size: 16px;
        font-weight: 600;
    }

    body.dark-theme #spotprice-loading {
        background: rgba(17, 17, 17, 0.7);
        color: #eee;
    }

    #spotprice-loading.visible {
        display: flex;
    }

    /* Spinner */
    #spotprice-loading::before {
        content: "";
        width: 22px;
        height: 22px;
        flex-shrink: 0;

        border: 4px solid rgba(74, 144, 226, 0.2);
        border-top-color: #4a90e2;
        border-radius: 50%;

        animation: spotprice-spin 0.8s linear infinite;
    }

    @keyframes spotprice-spin {
        to {
            transform: rotate(360deg);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        #spotprice-loading::before {
            animation: none;
        }
    }

    /* Dark theme styles */
    body.dark-theme {
      background-color: #111;
      color: #eee;
    }

    body.dark-theme h1 {
      color: #fff;
    }

    body.dark-theme .controls button {
      background-color: #333;
      color: white;
      border: 1px solid #555;
    }

    /* The desktop layout remains expanded; the drawer only appears on small screens. */
    .control-drawer {
      width: 90%;
    }

    .drawer-content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .drawer-inner {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .drawer-toggle {
      display: none;
      width: min(100%, 850px);
      margin: 0 auto;
      padding: 12px 14px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #fff;
      color: #333;
      font: inherit;
      font-size: 16px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
    }

    .drawer-toggle:focus-visible {
      outline: 3px solid #4a90e2;
      outline-offset: 2px;
    }

    .drawer-chevron {
      display: inline-block;
      font-size: 22px;
      line-height: 0;
      transition: transform 0.3s ease;
    }

    .control-drawer.is-open .drawer-chevron {
      transform: rotateX(180deg);
    }

    body.dark-theme .drawer-toggle {
      background-color: #333;
      color: #fff;
      border-color: #555;
    }

    @media (max-width: 700px) {
      .header-container {
        flex-direction: column;
      }

      .logo {
        position: static;
        margin-bottom: 8px;
      }

      .drawer-toggle {
        display: flex;
      }

      .drawer-content {
        display: grid;
        grid-template-rows: 0fr;
        padding-top: 0;
        overflow: hidden;
        visibility: hidden;
        transition:
          grid-template-rows 0.28s ease,
          padding-top 0.28s ease,
          visibility 0s linear 0.28s;
      }

      .drawer-inner {
        min-height: 0;
        overflow: hidden;
      }

      .control-drawer.is-open .drawer-content {
        grid-template-rows: 1fr;
        padding-top: 14px;
        visibility: visible;
        transition:
          grid-template-rows 0.28s ease,
          padding-top 0.28s ease,
          visibility 0s;
      }

      .control-drawer {
        margin-bottom: 10px;
      }

      .controls {
        width: 100%;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .controls-time {
        display: grid;
        grid-template-columns: max-content max-content;
        justify-content: center;
        column-gap: 16px;
        width: fit-content;
        max-width: 560px;
        box-sizing: border-box;
        margin: 0 auto;
        gap: 8px 12px;
      }

      .control-field {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-width: 0;
      }

      .control-field label {
        flex: 0 1 auto;
        min-width: 0;
        white-space: normal;
      }

      .controls-time input,
      .controls-time select {
        flex: 0 0 auto;
        width: auto;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }

      /* Keep the three action buttons in one row, allowing their labels to wrap. */
      .controls-action {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        width: min(100%, 520px);
        margin: 0 auto;
        gap: 8px;
      }

      .controls-action button {
        min-width: 0;
        padding: 8px 6px;
        line-height: 1.2;
      }

      .series-buttons {
        width: 100%;
        gap: 10px;
        margin-bottom: 0;
      }

      .series-button {
        max-width: 140px;
        padding: 4px 8px;
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      .controls-time {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: auto;
        max-width: 100%;
        gap: 8px;
      }

      .control-field {
        width: min(100%, 290px);
        justify-content: space-between;
      }

      .controls-action {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: stretch;
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
        gap: 8px;
      }

      .controls-action button {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        box-sizing: border-box;
        padding: 7px 5px;
        font-size: 14px;
        line-height: 1.2;
        text-align: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .drawer-content,
      .drawer-chevron {
        transition: none;
      }
    }

  </style>
</head>
<body class="light-theme">
  <!-- Logo positioned absolutely -->
  <img src="https://flaire.fi/wp-content/uploads/2024/04/Flaire-logo-white.png" alt="Logo" class="logo" />

  <!-- Header container for title -->
  <div class="header-container">
    <h1>Flaire Information Platform Demo</h1>
  </div>

  <div class="control-drawer" id="control-drawer">
    <button
      type="button"
      class="drawer-toggle"
      id="controls-toggle"
      aria-expanded="false"
      aria-controls="drawer-content"
    >
      <span>Chart controls</span>
      <span class="drawer-chevron" aria-hidden="true">⌵</span>
    </button>

    <div class="drawer-content" id="drawer-content">
      <div class="drawer-inner">
        <div class="controls">
          <div class="controls-time">
            <div class="control-field">
              <label for="forecast-date">Forecast date:</label>
              <input type="date" id="forecast-date">
            </div>

            <div class="control-field">
              <label for="history-select">History:</label>
              <select id="history-select"></select>
            </div>
          </div>

          <div class="controls-action">
            <button id="load-button">Load Forecast</button>
            <button id="latest-button">Latest Forecast</button>
            <button id="theme-toggle">Toggle Theme</button>
          </div>
        </div>

        <div id="series-buttons" class="series-buttons"></div>
      </div>
    </div>
  </div>

  <div class="chart-title-container">
    <h2 id="chart-title"></h2>
  </div>

  <div id="chart-container">
    <div id="chart" style="width:100%;height:100%;"></div>

    <div id="chart-loading" role="status" aria-live="polite">
      <span class="chart-loading-spinner" aria-hidden="true"></span>
      <span id="chart-loading-message">Loading chart library…</span>
    </div>

    <div id="spotprice-loading" aria-live="polite">Loading spot price data</div>
  </div>

  <div class="y-scale-button">
    <label>
      <input type="checkbox" id="spotprice-toggle">
      Overlay spot price
    </label>
    <label>
      <input type="checkbox" id="yAutoscaleToggle">
      Autoscale Y-axis
    </label>
  </div>

  <!-- <div class="chart-full-screen-button">
      <button onclick="toggleFullscreen()">Chart to fullscreen</button>
  </div> -->

  <script>
  const chartDiv = document.getElementById('chart');
  const chartLoading = document.getElementById("chart-loading");
  const chartLoadingMessage = document.getElementById("chart-loading-message");
  const forecastDateInput = document.getElementById('forecast-date');
  const loadButton = document.getElementById('load-button');
  const latestButton = document.getElementById('latest-button');
  const themeToggleButton = document.getElementById('theme-toggle');
  const historySelect = document.getElementById('history-select');
  const seriesButtonsContainer = document.getElementById('series-buttons');
  const controlsDrawer = document.getElementById('control-drawer');
  const controlsToggle = document.getElementById('controls-toggle');
  const mobileControlsMedia = window.matchMedia("(max-width: 700px)");
  const spotPriceToggle = document.getElementById("spotprice-toggle");
  const DEFAULT_TZ = "Europe/Helsinki";
  const DEFAULT_LANG = "EN";

  const yAutoscaleToggle = document.getElementById("yAutoscaleToggle");
  let yAutoscale = false;
  yAutoscaleToggle.checked = false;

  // Set spot price overlay off by default
  spotPriceToggle.checked = false;

  // API config (adjust base URL if needed)
  let API_BASE = ""; // if site served from same host as API
  if (location.hostname.endsWith("github.io")) {
    API_BASE = "https://flipapi.net"; // if site served at GitHub Pages
  }

  let currentSeriesKey = "consumption_emissions"; // default; will be updated from /info
  let currentForecastRequest = { mode: "latest", date: null };

  // Default to light theme
  let currentTheme = 'light';

  function setChartLoading(loading, message) {
      if (!chartLoading || !chartLoadingMessage) {
          console.warn("Chart loading elements not found.");
          return;
      }

      if (message) {
          chartLoadingMessage.textContent = message;
      }

      chartLoading.classList.toggle("is-hidden", !loading);
  }

  function setControlsDrawerOpen(open) {
    controlsDrawer.classList.toggle("is-open", open);
    controlsToggle.setAttribute("aria-expanded", String(open));
  }

  function closeControlsDrawerAfterSelection() {
    if (mobileControlsMedia.matches && controlsDrawer.classList.contains("is-open")) {
      setControlsDrawerOpen(false);
      controlsToggle.focus({ preventScroll: true });
    }
  }

  function syncControlsDrawerWithViewport() {
    // The drawer is always expanded on desktop and collapsed by default on mobile.
    setControlsDrawerOpen(!mobileControlsMedia.matches);
  }

  controlsToggle.addEventListener("click", () => {
    const isOpen = controlsDrawer.classList.contains("is-open");
    setControlsDrawerOpen(!isOpen);
  });

  if (typeof mobileControlsMedia.addEventListener === "function") {
    mobileControlsMedia.addEventListener("change", syncControlsDrawerWithViewport);
  } else {
    // Compatibility with older Safari versions.
    mobileControlsMedia.addListener(syncControlsDrawerWithViewport);
  }

  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && mobileControlsMedia.matches &&
        controlsDrawer.classList.contains("is-open")) {
      setControlsDrawerOpen(false);
      controlsToggle.focus();
    }
  });

  syncControlsDrawerWithViewport();

  function formatDate(date) {
    return date.toISOString().split('T')[0];
  }

  function formatPrettyDate(dateInput) {
    if (!dateInput) return "";
    
    // Use only the date part (YYYY-MM-DD) to avoid timezone shifting
    const datePart = typeof dateInput === 'string' ? dateInput.split('T')[0] : dateInput;
    
    return new Date(datePart).toLocaleDateString('en-US', {
      month: 'short',
      day: 'numeric',
      year: 'numeric',
      timeZone: 'UTC' // Ensures the date doesn't "jump" a day due to local time
    });
  }

  function getLangVer(field, lang = DEFAULT_LANG) {
    if (!field) return "";
    if (typeof field === "string") return field; // backward compatibility
    return field[lang] || field["EN"] || Object.values(field)[0] || "";
  }

  function buildLayout(forecastStart, payloadUnit, showSpotAxis = false) {
    const lightThemeGridColor = '#cccccc';

    const shapes = [];
    if (forecastStart) {
      shapes.push({
        type: 'line',
        x0: forecastStart,
        x1: forecastStart,
        yref: 'paper',
        y0: 0,
        y1: 1,
        line: {
          dash: 'dot',
          width: 2,
          color: '#888'
        }
      });
    }

    return {
      template: currentTheme === 'dark' ? 'plotly_dark' : 'plotly_white',
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(0,0,0,0)',

      hovermode: "x unified",

      legend: {
        orientation: 'h',
        x: 0.5,
        y: 1.02,
        xanchor: 'center',
        yanchor: 'bottom',
        bgcolor:
          currentTheme === "dark"
            ? "rgba(0,0,0,0.4)"
            : "rgba(255,255,255,0.7)",
        bordercolor:
          currentTheme === "dark"
            ? "rgba(255,255,255,0.2)"
            : "rgba(0,0,0,0.2)",
        borderwidth: 1,
        font: { size: 12 },
        traceorder: 'normal'
      },

      xaxis: {
        title: { text : "Time" },
        tickangle: 0,
        tickformat: "%H:%M<br>%d.%m.%y",
        rangeslider: { visible: true },
        gridcolor: currentTheme === 'light' ? lightThemeGridColor : undefined
      },
      yaxis: {
        autorange: true,
        automargin: true,
        title: { text: payloadUnit || "Value" },
        gridcolor: currentTheme === 'light' ? lightThemeGridColor : undefined
      },
      yaxis2: {
        title: { text: showSpotAxis ? "Spot price (€/MWh)" : "" },
        overlaying: "y",
        side: "right",
        anchor: "x",
        tickmode: "auto",
        showgrid: false,
        zeroline: false,
        automargin: true,
        autorange: true,
        visible: showSpotAxis
      },
      margin: { 
        l: 40, 
        r: showSpotAxis ? 45 : 20, 
        t: 0,
        b: 40 
      },
      autosize: true,
      shapes: shapes
    };
  }

  function makeTracesFromPayload(payload, yAutoscale) {
    const data = payload.data || {};
    const history = data.history || {};
    const forecast = data.forecast || {};
    const unit = getLangVer(payload.metadata?.unit) || "";

    const historyEntries = Object.entries(history).sort(
      (a, b) => new Date(a[0]) - new Date(b[0])
    );
    const forecastEntries = Object.entries(forecast).sort(
      (a, b) => new Date(a[0]) - new Date(b[0])
    );

    // Connect history and forecast traces by adding first forecast point to history
    if (historyEntries.length > 0 && forecastEntries.length > 0) {
      const firstForecast = forecastEntries[0];
      historyEntries.push(firstForecast);
    }

    // If autoscale is disabled, return simple traces without dynamic fill baseline
    if (!yAutoscale) {
      const historyTrace =  {
          x: historyEntries.map(e => e[0]),
          y: historyEntries.map(e => e[1]),
          type: "scatter",
          mode: "lines",
          name: "History",
          legendrank: 1,
          showlegend: true,
          meta: { unit: unit },
          fill: "tozeroy",
          fillcolor: "rgba(74,144,226,0.1)",
          line: { color: "rgb(74,144,226)", width: 3, shape: "spline" },
          hovertemplate: '<b>%{y:.2f} %{meta.unit}</b><extra>History</extra>'
        };
       const forecastTrace = {
          x: forecastEntries.map(e => e[0]),
          y: forecastEntries.map(e => e[1]),
          type: "scatter",
          mode: "lines",
          name: "Forecast",
          legendrank: 2,
          showlegend: true,
          meta: { unit: unit },
          fill: "tozeroy",
          fillcolor: "rgba(255,140,0,0.1)",
          line: { color: "rgb(255,140,0)", width: 3, shape: "spline" },
          hovertemplate: '<b>%{y:.2f} %{meta.unit}</b><extra>Forecast</extra>'
        };
      return [historyTrace, forecastTrace];
    }

    const historyTrace = {
      x: historyEntries.map(e => e[0]),
      y: historyEntries.map(e => e[1]),
      type: "scatter",
      mode: "lines",
      name: "History",
      legendrank: 1,
      showlegend: true,
      meta: { unit: unit },
      fill: 'tonexty',
      fillcolor: 'rgba(74, 144, 226, 0.1)',
      line: {
        color: 'rgb(74, 144, 226)', // Light blue
        width: 3,
        shape: 'spline'
      },
      hovertemplate: '<b>%{y:.2f} %{meta.unit}</b><extra>History</extra>',
    };

    const forecastTrace = {
      x: forecastEntries.map(e => e[0]),
      y: forecastEntries.map(e => e[1]),
      type: "scatter",
      mode: "lines",
      name: "Forecast",
      legendrank: 2,
      showlegend: true,
      meta: { unit: unit },
      fill: 'tonexty',
      fillcolor: 'rgba(255, 140, 0, 0.1)',
      line: {
        color: 'rgb(255, 140, 0)', // strong orange
        width: 3,
        shape: 'spline'
      },
      marker: { size: 6, symbol: 'circle', color: 'rgb(255, 140, 0)' },
      hovertemplate: '<b>%{y:.2f} %{meta.unit}</b><extra>Forecast</extra>',
    };

    // Determine y-axis baseline for dynamic fill baseline
    const allY = [
      ...historyEntries.map(e => e[1]),
      ...forecastEntries.map(e => e[1])
    ];

    const yMin = Math.min(...allY);
    const yMax = Math.max(...allY);
    // Set the baseline to next lower integer below yMin for better visual consistency
    const baseline = Math.floor(yMin - 1);

    const historyBaseline = {
      x: historyEntries.map(e => e[0]),
      y: Array(historyEntries.length).fill(baseline),
      type: "scatter",
      mode: "lines",
      showlegend: false,
      line: { width: 0 },
      hoverinfo: "skip"
    };

    const forecastBaseline = {
      x: forecastEntries.map(e => e[0]),
      y: Array(forecastEntries.length).fill(baseline),
      type: "scatter",
      mode: "lines",
      showlegend: false,
      line: { width: 0 },
      hoverinfo: "skip"
    };

    return [historyBaseline, historyTrace, forecastBaseline, forecastTrace];
  }

  // The API timestamps are already in local time; just remove the timezone offset.
  function getForecastTimeRange(payload) {
    const data = payload.data || {};
    const timestamps = [
      ...Object.keys(data.history || {}),
      ...Object.keys(data.forecast || {})
    // Remove timezone information for naive timestamps (split at '+')
    ].map(timestamp => timestamp.split("+")[0]).sort();

    if (!timestamps.length) return null;
    return { startTime: timestamps[0], endTime: timestamps[timestamps.length - 1] };
  }

  function makeSpotPriceTraces(payload, range) {
    const data = payload.data || {};
    const toEntries = obj => Object.entries(obj || {})
      .filter(([timestamp]) => {
        // Remove timezone information for naive timestamps (split at '+')
        const localTime = timestamp.split("+")[0];
        return localTime >= range.startTime && localTime <= range.endTime;
      })
      .sort();

    const historyEntries = toEntries(data.history);
    const forecastEntries = toEntries(data.forecast);
    const traces = [];

    if (historyEntries.length) {
      traces.push({
        x: historyEntries.map(e => e[0]),
        y: historyEntries.map(e => e[1]),
        type: "scatter",
        mode: "lines",
        name: "Spot price (history)",
        yaxis: "y2",
        line: { color: "rgb(0, 130, 110)", width: 2, dash: "dash" },
        hovertemplate: '<b>%{y:.2f} €/MWh</b><extra>Spot price (History)</extra>'
      });
    }

    if (forecastEntries.length) {
      traces.push({
        x: forecastEntries.map(e => e[0]),
        y: forecastEntries.map(e => e[1]),
        type: "scatter",
        mode: "lines",
        name: "Spot price (day-ahead)",
        yaxis: "y2",
        line: { color: "rgb(0, 170, 140)", width: 2, dash: "dash" },
        hovertemplate: '<b>%{y:.2f} €/MWh</b><extra>Spot price (Day-ahead)</extra>'
      });
    }

    return traces;
  }

  const SPOT_PRICE_CACHE_TTL = 15 * 60 * 1000; // 15 minutes in milliseconds
  const spotPriceLoading = document.getElementById("spotprice-loading");

  function setSpotPriceLoading(loading) {
    spotPriceLoading.classList.toggle("visible", loading);
  }

  function readSpotPriceCache(url) {
    const key = `spotprice:${url}`;

    try {
      const cachedValue = localStorage.getItem(key);
      if (!cachedValue) return null;

      const cached = JSON.parse(cachedValue);

      // Check expiration only when this cache entry is read
      if (!Number.isFinite(cached.savedAt) ||
          Date.now() - cached.savedAt >= SPOT_PRICE_CACHE_TTL) {
        localStorage.removeItem(key);
        return null;
      }

      return cached;
    } catch (error) {
      return null;
    }
  }

  function writeSpotPriceCache(url, payload) {
    try {
      localStorage.setItem(`spotprice:${url}`, JSON.stringify({
        savedAt: Date.now(),
        payload
      }));
    } catch (error) {
      console.warn("Could not cache spot prices locally:", error);
    }
  }

  async function fetchSpotPriceTraces(forecastPayload) {
    if (!spotPriceToggle.checked) return [];

    const range = getForecastTimeRange(forecastPayload);
    if (!range) return [];

    const params = new URLSearchParams({
      date_from: range.startTime,
      date_to: range.endTime,
      tz: DEFAULT_TZ
    });
    const url = `${API_BASE}/spotprice/range?${params.toString()}`;
    const cached = readSpotPriceCache(url);

    if (cached) {
      return makeSpotPriceTraces(cached.payload, range);
    }

    setSpotPriceLoading(true);
    try {
      const payload = await fetchJson(url);
      writeSpotPriceCache(url, payload);
      return makeSpotPriceTraces(payload, range);
    } catch (error) {
      console.warn("Could not load spot prices:", error);
      if (cached && cached.payload) {
        return makeSpotPriceTraces(cached.payload, range);
      }
      return [];
    } finally {
      setSpotPriceLoading(false);
    }
  }

  function initHistoryOptionsFromInfo(infoPayload, seriesKey, preserveSelection = false) {
    const hist = infoPayload.history.find(h => h.series_key === seriesKey);
    if (!hist) return;

    const start = new Date(hist.history_start);
    const end   = new Date(hist.history_end);

    const totalDays = Math.max(1, Math.floor((end - start) / (1000 * 60 * 60 * 24)));
    // const maxWeeks = Math.floor(totalDays / 7);
    const maxWeeks = 4; // limit to 4 weeks for usability

    const previousValue = preserveSelection ? historySelect.value : null;

    historySelect.innerHTML = "";

    // Up to 7 days
    const dayLimit = Math.min(7, totalDays);
    for (let d = 1; d <= dayLimit; d++) {
      const opt = document.createElement("option");
      opt.value = `${d}D`;
      opt.textContent = `${d} day${d > 1 ? "s" : ""}`;
      historySelect.appendChild(opt);
    }

    // Weeks from 2 to max
    for (let w = 2; w <= maxWeeks; w++) {
      const opt = document.createElement("option");
      opt.value = `${w}W`;
      opt.textContent = `${w} week${w > 1 ? "s" : ""}`;
      historySelect.appendChild(opt);
    }

    // Try to restore previous selection if still valid
    if (preserveSelection && previousValue &&
        historySelect.querySelector(`option[value="${previousValue}"]`)) {
      historySelect.value = previousValue;
    } else {
      // default selection
      if (historySelect.querySelector('option[value="1D"]')) {
        historySelect.value = "1D";
      } else if (historySelect.options.length > 0) {
        historySelect.value = historySelect.options[historySelect.options.length - 1].value;
      }
    }
  }

  function initSeriesButtons(infoPayload) {
    setChartLoading(true, "Loading forecast…");
    seriesButtonsContainer.innerHTML = "";

    infoPayload.series.forEach((s, idx) => {
      const btn = document.createElement("button");
      const fullName = getLangVer(s.name);

      btn.textContent = fullName
      btn.title = fullName
      btn.className = "series-button";
      btn.dataset.seriesKey = s.series_key;

      if (s.series_key === currentSeriesKey || (!currentSeriesKey && idx === 0)) {
        currentSeriesKey = s.series_key;
        btn.classList.add("active");
      }

      btn.addEventListener("click", () => {
        // closeControlsDrawerAfterSelection();
        currentSeriesKey = s.series_key;

        // update active state
        document.querySelectorAll(".series-button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        // rebuild history options for the selected series, preserving selection if possible
        initHistoryOptionsFromInfo(infoPayload, currentSeriesKey, true);

        // reload latest forecast for this series
        loadLatestForecast();
      });

      seriesButtonsContainer.appendChild(btn);
    });

    // Initialize history dropdown for currently selected series
    initHistoryOptionsFromInfo(infoPayload, currentSeriesKey);
  }

  async function fetchJson(url) {
    const response = await fetch(url, {
      headers: {
        "bypass-tunnel-reminder": "true"
        // "ngrok-skip-browser-warning": "1"
      }
    });
    if (!response.ok) {
      throw new Error(`HTTP error! Status: ${response.status}`);
    }
    return response.json();
  }

  async function fetchInfo() {
    const url = `${API_BASE}/info`;
    const response = await fetch(url, {
      headers: {
        "bypass-tunnel-reminder": "true"
      }
    });
    if (!response.ok) {
      throw new Error(`Failed to load /info: ${response.status}`);
    }
    return response.json();
  }

  async function loadForecastByDate(dateStr) {
    setChartLoading(true, "Loading forecast…");
    if (!dateStr) {
      chartDiv.innerHTML = `<p style="color:red;">Please select a forecast date.</p>`;
      return;
    }

    const params = new URLSearchParams({
      series_key: currentSeriesKey,
      date: dateStr,
      history_len: historySelect.value || "3D",
      tz: DEFAULT_TZ
    });

    const url = `${API_BASE}/forecast?${params.toString()}`;

    try {
      const payload = await fetchJson(url);

      if (payload.error) {
        chartDiv.innerHTML = `<p style="color:red;">${payload.error}</p>`;
        return;
      }

      currentForecastRequest = { mode: "date", date: dateStr };
      const traces = makeTracesFromPayload(payload, yAutoscale);
      const spotTraces = await fetchSpotPriceTraces(payload);
      const showSpotPrices = spotTraces.length > 0
      traces.push(...spotTraces);
      const forecastStart = payload.metadata && payload.metadata.forecast_start;
      const titleDate = formatPrettyDate(forecastStart);
      const seriesName = getLangVer(payload.metadata?.name).toLowerCase();
      const title = `${seriesName.charAt(0).toUpperCase() + seriesName.slice(1)} for ${titleDate}`;

      document.getElementById("chart-title").textContent = title;
      document.getElementById("chart-container").classList.toggle("has-spotprices", showSpotPrices);

      const payloadUnit = getLangVer(payload.metadata?.unit);
      const layout = buildLayout(forecastStart, payloadUnit, showSpotPrices);
      const config = { 
        responsive: true, 
        displaylogo: false, 
        displayModeBar: false
        };
      await Plotly.newPlot(chartDiv, traces, layout, config);
      setChartLoading(false);
    } catch (error) {
      chartDiv.innerHTML = `<p style="color:red;">Could not load forecast data. ${error.message}</p>`;
      console.error("Error loading forecast by date:", error);
      setChartLoading(false);
    }
  }

  async function loadLatestForecast() {
    const params = new URLSearchParams({
      series_key: currentSeriesKey,
      history_len: historySelect.value || "3D",
      tz: DEFAULT_TZ
    });

    const url = `${API_BASE}/forecast/latest?${params.toString()}`;

    try {
      const payload = await fetchJson(url);

      if (payload.error) {
        chartDiv.innerHTML = `<p style="color:red;">${payload.error}</p>`;
        return;
      }

      currentForecastRequest = { mode: "latest", date: null };
      const traces = makeTracesFromPayload(payload, yAutoscale);
      const spotTraces = await fetchSpotPriceTraces(payload);
      const showSpotPrices = spotTraces.length > 0
      traces.push(...spotTraces);
      const forecastStart = payload.metadata && payload.metadata.forecast_start;
      const titleDate = formatPrettyDate(forecastStart);
      const seriesName = getLangVer(payload.metadata?.name).toLowerCase();
      const title = `${seriesName.charAt(0).toUpperCase() + seriesName.slice(1)} for ${titleDate}`
      document.getElementById("chart-title").textContent = title;
      document.getElementById("chart-container").classList.toggle("has-spotprices", showSpotPrices);

      const payloadUnit = getLangVer(payload.metadata?.unit);
      const layout = buildLayout(forecastStart, payloadUnit, showSpotPrices);
      const config = { 
        responsive: true, 
        displaylogo: false, 
        displayModeBar: false,
        };
      await Plotly.newPlot(chartDiv, traces, layout, config);
      setChartLoading(false);
    } catch (error) {
      chartDiv.innerHTML = `<p style="color:red;">Could not load latest forecast. ${error.message}</p>`;
      console.error("Error loading latest forecast:", error);
      setChartLoading(false);
    }
  }

  function toggleTheme() {
    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
    document.body.classList.toggle('dark-theme');

    const newTemplate = currentTheme === 'dark' ? 'plotly_dark' : 'plotly_white';
    const newGridColor = currentTheme === 'light' ? '#cccccc' : undefined;

    Plotly.relayout(chartDiv, {
      template: newTemplate,
      'xaxis.gridcolor': newGridColor,
      'yaxis.gridcolor': newGridColor
    });
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      chartDiv.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }

  // --- Event Listeners ---
  loadButton.addEventListener('click', () => {
    // closeControlsDrawerAfterSelection();
    loadForecastByDate(forecastDateInput.value);
  });

  latestButton.addEventListener('click', () => {
    // closeControlsDrawerAfterSelection();
    loadLatestForecast();
  });

  themeToggleButton.addEventListener('click', () => {
    // closeControlsDrawerAfterSelection();
    toggleTheme();
  });

  spotPriceToggle.addEventListener('change', () => {
    if (currentForecastRequest.mode === "date") {
      loadForecastByDate(currentForecastRequest.date);
    } else {
      loadLatestForecast();
    }
  });

  historySelect.addEventListener('change', () => {
    // closeControlsDrawerAfterSelection();
    loadLatestForecast();
  });

  yAutoscaleToggle.addEventListener('change', () => {
    yAutoscale = yAutoscaleToggle.checked;
    loadLatestForecast();
  });

  // document.addEventListener('fullscreenchange', () => {
  //   Plotly.Plots.resize(chart);
  // });

  async function initialize() {
    setChartLoading(true, "Loading forecast options…");
    const today = new Date();
    forecastDateInput.value = formatDate(today);

    try {
      const infoPayload = await fetchInfo();
      initSeriesButtons(infoPayload);
    } catch (err) {
      console.error("Could not initialize series/history options:", err);
    }

    await loadLatestForecast();
  }

  document.addEventListener("DOMContentLoaded", () => {
      if (!window.Plotly) {
          setChartLoading(false);
          chartDiv.textContent =
              "Could not load the chart library. Please check your connection and reload the page.";
          return;
      }

      initialize();
  }, { once: true });
</script>
